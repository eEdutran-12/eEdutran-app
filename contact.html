<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#317EFB">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - eEdutran Online Tutoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #2b989c 0%, #325a7b 30%, #5d3579 70%, #9e2a6b 100%);
            font-family: 'Comic Sans MS', 'Comic Neue', 'Arial', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 54px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(43, 152, 156, 0.98);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-bottom: 2px solid #00e5ff;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: conic-gradient(from 180deg at 50% 50%, #9b51e0, #27ae60, #f2c94c, #eb5757, #9b51e0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(255,255,255,0.5);
            font-family: 'Arial Black', sans-serif;
        }
        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }
        .logo-title {
            font-family: 'Verdana', sans-serif;
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        .logo-subtitle {
            font-family: 'Courier New', monospace;
            font-size: 7px;
            color: #76ff03;
            font-weight: bold;
            letter-spacing: 0.8px;
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            background: #1b1464;
            border: 2px solid #00e5ff;
            color: #00e5ff;
            font-family: 'Lucida Console', monospace;
            font-size: 11px;
            font-weight: bold;
            border-radius: 9999px;
            padding: 5px 12px;
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .nav-link:hover {
            background: #00e5ff;
            color: #1b1464;
            box-shadow: 0 0 10px #00e5ff;
        }

        .header-cta-btn {
            background: #e58e26;
            border: 2px solid #fff200;
            color: #ffffff;
            font-family: 'Impact', sans-serif;
            font-size: 11px;
            letter-spacing: 0.5px;
            border-radius: 9999px;
            padding: 5px 12px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .main-container {
            max-width: 800px;
            margin: 100px auto 40px auto;
            padding: 20px;
            background: rgba(30, 39, 46, 0.9);
            border-radius: 20px;
            border: 3px solid #00d2d3;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: #ffea00;
            font-family: 'Arial Black', sans-serif;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #00e5ff;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #00d2d3;
            background: #2f3640;
            color: #ffffff;
            font-size: 14px;
        }

        button.submit-btn {
            width: 100%;
            background: #eb2f06;
            border: 2px solid #ff7979;
            color: white;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button.submit-btn:hover {
            background: #ff3838;
        }
    </style>
</head>
<body>

    <header class="top-header">
        <a href="index.html" class="logo-container">
            <div class="logo-icon">e</div>
            <div class="logo-text">
                <span class="logo-title">eEdutran</span>
                <span class="logo-subtitle">ONLINE TUTORING</span>
            </div>
        </a>

        <nav class="nav-container">
            <a href="index.html" class="nav-link">Homepage</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="contact.html#callback-form" class="header-cta-btn">Free Trial</a>
        </nav>
    </header>

    <main class="main-container" id="callback-form">
        <h1>Book Your Free Trial / Get In Touch</h1>
        <form action="#" method="post">
            <div class="form-group">
                <label for="name">Parent / Student Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter email address">
            </div>
            <div class="form-group">
                <label for="phone">WhatsApp / Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="Enter contact number">
            </div>
            <div class="form-group">
                <label for="level">Academic Level</label>
                <select id="level" name="level">
                    <option value="ks2">KS2 (Primary)</option>
                    <option value="ks3">KS3 (Lower Secondary)</option>
                    <option value="gcse">GCSE / IGCSE</option>
                    <option value="alevel">A-Level / AS</option>
                </select>
            </div>
            <div class="form-group">
                <label for="message">Subjects or Preferred Time Slots</label>
                <textarea id="message" name="message" rows="4" placeholder="Tell us about the subjects or requirements..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Submit & Request Free Trial</button>
        </form>
    </main>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker registered successfully:', reg.scope))
            .catch((err) => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
</body>
</html>
